# On-demand: set R2 + public-media Fly secrets from GitHub secrets.
# Prefer explicit R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (from Cloudflare → R2 →
# API Tokens). Falls back to deriving S3 keys from CLOUDFLARE_API_TOKEN when that
# token can verify (Access Key ID = token id, Secret = sha256 hex of token value).
#
#   gh secret set R2_ACCESS_KEY_ID
#   gh secret set R2_SECRET_ACCESS_KEY
#   gh workflow run ops-fly-r2-secrets.yml
name: Ops — Fly R2 secrets

on:
  workflow_dispatch:
    inputs:
      generate_kek:
        description: "Generate GHOSTWRITER_PROVIDER_KEK_V1 if not already on Fly"
        type: boolean
        default: true
      app:
        description: "Fly app name"
        type: string
        default: ghostwriter-backend

permissions:
  contents: read

jobs:
  set-fly-r2-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Set Fly R2 + public media secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GENERATE_KEK: ${{ inputs.generate_kek }}
          FLY_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" || -z "${FLY_API_TOKEN}" ]]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID or FLY_API_TOKEN" >&2
            exit 1
          fi

          ACCESS_KEY_ID="${R2_ACCESS_KEY_ID:-}"
          SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY:-}"

          if [[ -n "$ACCESS_KEY_ID" && -n "$SECRET_ACCESS_KEY" ]]; then
            echo "Using explicit R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY GitHub secrets."
          else
            echo "R2_* secrets unset; trying to derive from CLOUDFLARE_API_TOKEN..."
            if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
              echo "Missing CLOUDFLARE_API_TOKEN and R2_* secrets." >&2
              exit 1
            fi

            # User API tokens
            VERIFY_CODE="$(curl -sS -o /tmp/cf-verify.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
            echo "user/tokens/verify HTTP ${VERIFY_CODE}"

            # Account API tokens
            if [[ "$VERIFY_CODE" != "200" ]]; then
              VERIFY_CODE="$(curl -sS -o /tmp/cf-verify.json -w '%{http_code}' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" || true)"
              echo "accounts/.../tokens/verify HTTP ${VERIFY_CODE}"
            fi

            # Smoke: can this token talk to R2 at all?
            R2_CODE="$(curl -sS -o /tmp/cf-r2.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets" || true)"
            echo "accounts/.../r2/buckets HTTP ${R2_CODE}"

            if [[ "$VERIFY_CODE" != "200" ]]; then
              echo "CLOUDFLARE_API_TOKEN cannot verify (HTTP ${VERIFY_CODE})." >&2
              echo "That GH secret is likely the Pages/Wrangler API token, not the R2 S3 credential" >&2
              echo "shown under R2 → API Tokens (Access Key ID + Secret Access Key)." >&2
              echo "" >&2
              echo "Fix: create an Account API token on R2 (Admin Read & Write), then:" >&2
              echo "  gh secret set R2_ACCESS_KEY_ID" >&2
              echo "  gh secret set R2_SECRET_ACCESS_KEY" >&2
              echo "and re-run this workflow." >&2
              exit 1
            fi

            ACCESS_KEY_ID="$(node -e 'const j=require("/tmp/cf-verify.json"); if(!j.success||!j.result?.id){console.error(JSON.stringify(j)); process.exit(1)} process.stdout.write(j.result.id)')"
            SECRET_ACCESS_KEY="$(node -e 'const c=require("crypto"); process.stdout.write(c.createHash("sha256").update(process.argv[1]).digest("hex"))' "$CLOUDFLARE_API_TOKEN")"
            echo "Derived R2 S3 credentials from verified Cloudflare API token."
          fi

          echo "Account: ${CLOUDFLARE_ACCOUNT_ID}"
          echo "Fly app: ${FLY_APP}"

          curl -fsS -L https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="$HOME/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"

          ARGS=(
            "R2_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}"
            "R2_ACCESS_KEY_ID=${ACCESS_KEY_ID}"
            "R2_SECRET_ACCESS_KEY=${SECRET_ACCESS_KEY}"
            "R2_BUCKET_NAME=ghostwriter-capture"
            "GHOSTWRITER_PUBLIC_MEDIA_ORIGIN=https://media.ghost-writer.studio"
            "GHOSTWRITER_PUBLIC_R2_BUCKET_NAME=ghostwriter-public-media"
          )

          if [[ "${GENERATE_KEK}" == "true" ]]; then
            if ! fly secrets list -a "$FLY_APP" | awk '{print $1}' | grep -qx 'GHOSTWRITER_PROVIDER_KEK_V1'; then
              KEK="$(openssl rand -base64 32)"
              ARGS+=("GHOSTWRITER_PROVIDER_KEK_V1=${KEK}" "GHOSTWRITER_PROVIDER_KEK_ACTIVE=V1")
              echo "Generated new provider KEK_V1 for Fly (value not printed)."
            else
              echo "Provider KEK already present on Fly; leaving unchanged."
            fi
          fi

          fly secrets set -a "$FLY_APP" "${ARGS[@]}"
          echo "Fly secrets updated."

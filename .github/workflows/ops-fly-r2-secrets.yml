# One-shot / on-demand: derive R2 S3 credentials from CLOUDFLARE_API_TOKEN and
# set them on Fly with public media config. Secret values never echo.
#
# Trigger: gh workflow run ops-fly-r2-secrets.yml
name: Ops — Fly R2 secrets

on:
  workflow_dispatch:
    inputs:
      generate_kek:
        description: "Generate GHOSTWRITER_PROVIDER_KEK_V1 if not already on Fly"
        type: boolean
        default: true
      app:
        description: "Fly app name"
        type: string
        default: ghostwriter-backend

permissions:
  contents: read

jobs:
  set-fly-r2-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Derive R2 S3 keys and set Fly secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GENERATE_KEK: ${{ inputs.generate_kek }}
          FLY_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" || -z "${FLY_API_TOKEN}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, or FLY_API_TOKEN" >&2
            exit 1
          fi

          VERIFY="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          ACCESS_KEY_ID="$(node -e 'const j=JSON.parse(process.argv[1]); if(!j.success||!j.result?.id){console.error("token verify failed"); process.exit(1)} process.stdout.write(j.result.id)' "$VERIFY")"
          SECRET_ACCESS_KEY="$(node -e 'const c=require("crypto"); process.stdout.write(c.createHash("sha256").update(process.argv[1]).digest("hex"))' "$CLOUDFLARE_API_TOKEN")"

          echo "Verified Cloudflare API token; derived R2 Access Key ID (not printed)."
          echo "Account: ${CLOUDFLARE_ACCOUNT_ID}"
          echo "Fly app: ${FLY_APP}"

          curl -fsS -L https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="$HOME/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"

          ARGS=(
            "R2_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}"
            "R2_ACCESS_KEY_ID=${ACCESS_KEY_ID}"
            "R2_SECRET_ACCESS_KEY=${SECRET_ACCESS_KEY}"
            "R2_BUCKET_NAME=ghostwriter-capture"
            "GHOSTWRITER_PUBLIC_MEDIA_ORIGIN=https://media.ghost-writer.studio"
            "GHOSTWRITER_PUBLIC_R2_BUCKET_NAME=ghostwriter-public-media"
          )

          if [[ "${GENERATE_KEK}" == "true" ]]; then
            # Only set KEK when Fly does not already list one (names only).
            if ! fly secrets list -a "$FLY_APP" | awk '{print $1}' | grep -qx 'GHOSTWRITER_PROVIDER_KEK_V1'; then
              KEK="$(openssl rand -base64 32)"
              ARGS+=("GHOSTWRITER_PROVIDER_KEK_V1=${KEK}" "GHOSTWRITER_PROVIDER_KEK_ACTIVE=V1")
              echo "Generated new provider KEK_V1 for Fly (value not printed)."
            else
              echo "Provider KEK already present on Fly; leaving unchanged."
            fi
          fi

          fly secrets set -a "$FLY_APP" "${ARGS[@]}"
          echo "Fly secrets updated. Confirm with: fly secrets list -a ${FLY_APP}"
